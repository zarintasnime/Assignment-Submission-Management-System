      <rect x="614" y="314" width="34" height="6" rx="3" fill="#c9a227"/>
      <rect x="614" y="328" width="52" height="5" rx="2.5" fill="#1b2440" opacity=".3"/>
      <rect x="614" y="339" width="40" height="5" rx="2.5" fill="#1b2440" opacity=".2"/>
