<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="A teacher standing beside a board of published assignments">
  <defs>
    <clipPath id="tRound"><circle cx="200" cy="200" r="176"/></clipPath>
  </defs>

  <!-- backdrop -->
  <circle cx="200" cy="200" r="176" fill="#f4e8d2"/>
  <g clip-path="url(#tRound)">
    <rect x="0" y="286" width="400" height="120" fill="#e8dcc2"/>

    <!-- board -->
    <rect x="196" y="72" width="180" height="140" rx="8" fill="#1b2440"/>
    <rect x="196" y="72" width="180" height="140" rx="8" fill="none" stroke="#c9a227" stroke-width="5"/>
    <rect x="216" y="96" width="90" height="9" rx="4.5" fill="#c9a227"/>
    <rect x="216" y="120" width="140" height="7" rx="3.5" fill="#ffffff" opacity=".5"/>
    <rect x="216" y="138" width="118" height="7" rx="3.5" fill="#ffffff" opacity=".35"/>
    <rect x="216" y="156" width="132" height="7" rx="3.5" fill="#ffffff" opacity=".35"/>
    <rect x="216" y="178" width="52" height="18" rx="9" fill="#1d6f58"/>
    <text x="242" y="191" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#e3f1eb">PUBLISHED</text>
    <rect x="252" y="212" width="68" height="8" rx="4" fill="#c8c0b1"/>

    <!-- teacher figure -->
    <!-- back leg / skirt -->
    <path d="M104 236 h84 l16 122 h-40 l-14 -78 -14 78 h-40z" fill="#1b2440"/>
    <!-- shoes -->
    <rect x="120" y="350" width="46" height="14" rx="7" fill="#171d2c"/>
    <rect x="166" y="350" width="46" height="14" rx="7" fill="#171d2c"/>
    <!-- torso -->
    <path d="M108 150 q38 -18 76 0 l14 96 h-104z" fill="#1d6f58"/>
    <!-- collar -->
    <path d="M132 146 l14 22 l14 -22 l-6 -6 h-16z" fill="#e3f1eb"/>
    <!-- pointing arm -->
    <path d="M182 160 q34 6 44 -20" fill="none" stroke="#1d6f58" stroke-width="20" stroke-linecap="round"/>
    <circle cx="230" cy="139" r="11" fill="#c98a5e"/>
    <!-- resting arm + book -->
    <path d="M114 162 q-16 30 -2 56" fill="none" stroke="#1d6f58" stroke-width="20" stroke-linecap="round"/>
    <g transform="rotate(-12 106 224)">
      <rect x="76" y="206" width="62" height="42" rx="4" fill="#c9a227"/>
      <rect x="76" y="206" width="62" height="42" rx="4" fill="none" stroke="#1b2440" stroke-width="3"/>
      <line x1="107" y1="206" x2="107" y2="248" stroke="#1b2440" stroke-width="3"/>
    </g>
    <circle cx="110" cy="222" r="11" fill="#c98a5e"/>
    <!-- neck + head -->
    <rect x="138" y="120" width="20" height="22" rx="8" fill="#c98a5e"/>
    <circle cx="148" cy="102" r="32" fill="#c98a5e"/>
    <!-- hair bun -->
    <path d="M116 100 q0 -36 32 -36 q32 0 32 36 q-10 -16 -32 -16 q-22 0 -32 16z" fill="#2a1c14"/>
    <circle cx="180" cy="80" r="14" fill="#2a1c14"/>
    <!-- face -->
    <circle cx="139" cy="102" r="3" fill="#1b2440"/>
    <circle cx="159" cy="102" r="3" fill="#1b2440"/>
    <path d="M141 114 q8 7 16 0" fill="none" stroke="#1b2440" stroke-width="3" stroke-linecap="round"/>
    <!-- lanyard -->
    <path d="M136 146 l12 30 l12 -30" fill="none" stroke="#c9a227" stroke-width="4"/>
    <rect x="140" y="176" width="18" height="24" rx="3" fill="#f7f4ee" stroke="#1b2440" stroke-width="2"/>
  </g>
  <circle cx="200" cy="200" r="176" fill="none" stroke="#1b2440" stroke-width="4" stroke-opacity=".12"/>
</svg>
